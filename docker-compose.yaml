services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./staticfiles/:/staticfiles/
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      dockerfile: ./Dockerfile
    command: >
      sh -c "
        python /app/diploma-backend/manage.py collectstatic --noinput &&
        python /app/diploma-backend/manage.py migrate &&
        gunicorn --chdir /app/diploma-backend --bind 0.0.0.0:8000 shop.wsgi:application
      "
    ports:
      - "8000"
    volumes:
      - ./staticfiles/:/app/diploma-backend/staticfiles/
    env_file:
      - ./.env

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}
    volumes:
      - ./db/:/var/lib/postgresql/data
    env_file:
      - ./.env

  redis:
    image: redis:7-alpine
    ports:
      - ${REDIS_PORT}
    env_file:
      - ./.env
