[project]
name = "django-online-store"
version = "0.1.0"
description = "Django-based online store application"
authors = [
    {name = "kil-2310", email = "homakove600@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "django>=5.1,<5.2",
    "psycopg2-binary>=2.9.10",
    "djangorestframework>=3.15.2",
    "django-cors-headers>=4.4.0",
    "django-allauth>=0.63.2",
    "djangorestframework-simplejwt>=5.3.1",
    "pillow>=10.4.0",
    "django-crispy-forms>=2.3",
    "crispy-bootstrap5>=0.7",
    "django-haystack>=3.2.1",
    "stripe>=5.0.0",
    "celery>=5.4.0",
    "django-celery-results>=2.5.0",
    "django-celery-beat>=2.5.0",
    "redis>=5.0.0",
    "django-redis>=5.4.0",
    "django-debug-toolbar>=4.4.0",
    "ipdb>=0.13.0",
    "python-dotenv>=1.0.0",
    "whitenoise>=6.7.0",
    "django-storages>=1.14.0",
    "boto3>=1.34.0",
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "factory-boy>=3.3.0",
    "faker>=18.0.0",
    "django-ckeditor>=6.7.0",
    "django-mptt>=0.16.0",
    "django-import-export>=4.0.0",
    "django-filter>=24.3",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "django-rest-framework (>=0.1.0,<0.2.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = "tests.py test_*.py *_tests.py"

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.black]
line-length = 88
target-version = ['py312']

[tool.flake8]
max-line-length = 88
exclude = "migrations,venv,.venv,.git,__pycache__"